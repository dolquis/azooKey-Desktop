#:schema https://developers.openai.com/codex/config-schema.json

# Codex CLI のプロジェクト設定。Codex は trust された project でのみ読み込むため、
# 各開発者が初回起動時に trust プロンプトに同意する必要がある。
#
# TOML の文法上、トップレベルのスカラーキーは最初の [テーブル] 見出しより前に
# 置く必要があるため、本ファイルは「トップレベル設定」→「テーブル定義」の順で
# 構成している。

# ─────────────────────────────────────────────
# トップレベル設定 (サンドボックス / 承認ポリシー)
# ─────────────────────────────────────────────

# workspace-write: リポジトリ内の書き込みは許可、外部ネットワークは別途許可
sandbox_mode = "workspace-write"

# sandbox 外の操作は必要に応じて承認する。承認済みの作業範囲は AGENTS.md に従う。
approval_policy = "on-request"

# ─────────────────────────────────────────────
# サンドボックス: workspace-write の挙動
# ─────────────────────────────────────────────

[sandbox_workspace_write]
# GoogleTest FetchContent などのためにネットワーク許可
network_access = true

# ─────────────────────────────────────────────
# ホスト固有の設定
# ─────────────────────────────────────────────

# Windows sandbox の方式と任意 MCP はユーザー設定で選ぶ。
# この repo ではホストの選択を上書きせず、未導入の UI ツールを起動しない。
# 設定例と移行手順: docs/handoff/agent-tooling-setup.md

# ─────────────────────────────────────────────
# サブエージェント (カスタム agent は .codex/agents/*.toml)
# ─────────────────────────────────────────────

# 書式と継承規則: https://learn.chatgpt.com/docs/agent-configuration/subagents
# 各 agent の model / reasoning effort は未指定なら親から継承する。
[agents]
enabled = true
# 共有 build directory と Serena の対象変更を直列管理するため、同時実行は控えめにする。
max_concurrent_threads_per_session = 4
