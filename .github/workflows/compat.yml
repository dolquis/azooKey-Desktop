name: Compatibility tests

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: Notepad / VS Code / Edge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'compat-test')
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Cache fetched dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/windows-release/_deps
          key: compat-googletest-wil-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-release -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_WIL=ON

      - name: Build compatibility runner
        shell: pwsh
        run: cmake --build --preset windows-release --target compat_test

      - name: Run compatibility targets
        id: run_compat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'build/windows-release/compat-test/compat_test.exe'
          $results = @(
            foreach ($target in 'notepad', 'vscode', 'edge') {
              $output = "compat-report-$target"
              $log = "compat-run-$target.log"
              & $runner --target "compat-test/targets/$target.json" --output $output *>&1 |
                Tee-Object -FilePath $log | Out-Null
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0) {
                Write-Warning "$target compatibility run exited with $exitCode"
              }
              [ordered]@{ target = $target; exit_code = $exitCode }
            }
          )
          $results | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath compat-summary.json -Encoding utf8

          @(
            '## Compatibility artifact collection'
            ''
            '| Target | Exit code |'
            '|---|---:|'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          foreach ($result in $results) {
            "| $($result.target) | $($result.exit_code) |" |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          '' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          'This hosted job collects runner diagnostics. It does not register or select the azooKey TIP, so a green job is not an M50 compatibility pass.' |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          # GitHub's pwsh wrapper propagates the last native exit code unless the
          # artifact-collection step explicitly reports its own successful result.
          exit 0

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compat-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            compat-report-*/
            compat-run-*.log
            compat-summary.json
          if-no-files-found: warn
          retention-days: 7
