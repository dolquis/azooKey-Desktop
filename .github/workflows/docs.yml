name: Docs lint

on:
  # paths で絞らない。コードだけの変更（rename・削除）でも文書の参照の実在検査と
  # 実体との突合を走らせ、docs が偽になった PR をその時点で止めるためである。
  push:
    branches: [main]
  pull_request:
    # edited は PR 本文の Documentation impact を書き直したときに docs-impact を再評価するため。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # docs-lint（dolquis/agent-ops origin のベンダリングコピー）。判定はベースライン
      # 比較で、既存の findings は .docs-lint-baseline.json で凍結し、増加だけを止める。
      # ファイル単位・カテゴリ単位で件数が増えたら非 0 終了する。DECISIVE は全ファイル
      # 0 件で凍結してあるため、1 件でも出れば増加として落ちる。
      - name: docs-lint (baseline ratchet)
        run: python3 scripts/docs-lint.py --baseline .docs-lint-baseline.json

      # AGENTS.md の予算検査（同じく origin のベンダリングコピー）。目標 12 KiB 超過は
      # annotation で可視化し、上限 16 KiB 超過は非 0 終了で PR を止める。
      - name: Test AGENTS.md size checker
        run: python3 scripts/tests/test_agent_instruction_size.py

      - name: Enforce AGENTS.md byte budget
        run: python3 scripts/check_agent_instruction_size.py

      # docs/test-inventory.md はテスト一覧の正典なので、CMake がテストを増減したら
      # 同じ PR で表も更新させる。
      - name: Test the test inventory checker
        run: python3 scripts/tests/test_check_test_inventory.py

      - name: Check the test inventory against CMake
        run: python3 scripts/check_test_inventory.py

      # .claude/skills/MANIFEST.md が repo 固有と分類した Skill の routing 表は、
      # ファイル名と CTest target を手書きで持つ。実体が動いたら同じ PR で直させる。
      - name: Test the skill reference checker
        run: python3 scripts/tests/test_check_skill_references.py

      - name: Check repo-owned skills against the repository
        run: python3 scripts/check_skill_references.py

      # .claude/agents/MANIFEST.md が区分 repo とした agent は、Claude 側 .md と Codex 側
      # .toml の本文・description・役割境界を揃える契約を持つ。片側だけ直した PR を
      # ここで止める。read-only guard hook の allow / deny 表と、git push guard hook の
      # allow / deny / ask 表、specialist の SubagentStart / SubagentStop hook の振る舞いも
      # 同じジョブで固定する。
      - name: Test the agent definition checker and the guard hooks
        run: |
          python3 scripts/tests/test_check_agent_definitions.py
          python3 scripts/tests/test_agent_readonly_guard.py
          python3 scripts/tests/test_subagent_snapshot.py
          python3 scripts/tests/test_git_push_guard.py
          python3 scripts/tests/test_codex_push.py

      - name: Test the Codex document hook adapter
        run: python3 scripts/tests/test_codex_docs_lint_hook.py

      - name: Check agent definitions against the manifest
        run: python3 scripts/check_agent_definitions.py

      # 文書が名指しするパス、file::symbol、spec の § 参照の実在を確かめる。不在でも正しい参照は
      # scripts/doc-refs-allowlist.toml に登録したものだけを許し、実在したら登録の削除を求める。
      - name: Test the document reference checker
        run: python3 scripts/tests/test_check_doc_refs.py

      - name: Check that document references resolve
        run: python3 scripts/check_doc_refs.py

      # IPC の型の表（architecture の索引と tsf-ipc-protocol Skill）、spec の設定キー表、文書中の
      # preset 名を、MessageType・Dispatcher・schema・CMakePresets と突き合わせる。
      - name: Test the document contract checker
        run: python3 scripts/tests/test_check_doc_contracts.py

      - name: Check documents against IPC types, settings schema, and presets
        run: python3 scripts/check_doc_contracts.py

      # 契約ファイル（一覧は scripts/check_docs_impact.py の CONTRACT_PATHS）を変えて docs を
      # 変えない PR に、本文の Documentation impact で影響なしの理由を求める。
      - name: Test the docs impact gate
        run: python3 scripts/tests/test_check_docs_impact.py

  docs-impact:
    name: docs-impact
    # PR 本文を読むので pull_request だけで走らせる。Dependabot の PR は本文がテンプレートに
    # 従わないため除外する（skip は required check を満たす）。作成者で判定するのは、人間が
    # Dependabot の PR を編集しても github.actor が変わるだけで作成者は変わらないため。
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          # pull_request の checkout は base へ PR を merge した commit になる。その第 1 親との差分が、
          # main に入る変更そのものである（event の base.sha が古くても main 側の変更が混ざらない）。
          fetch-depth: 2

      # 本文は event の JSON から読み、run の中に式で埋め込まない（injection 対策）。環境変数で
      # 渡さないのは、長い本文が 1 変数あたりの上限を超えて exec に失敗しうるためである。
      - name: Check the documentation impact of contract changes
        run: |
          python3 -c 'import json, os, sys; body = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["pull_request"].get("body") or ""; open(sys.argv[1], "w", encoding="utf-8").write(body)' "$RUNNER_TEMP/pr-body.md"
          python3 scripts/check_docs_impact.py --base HEAD^1 --head HEAD --body-file "$RUNNER_TEMP/pr-body.md"
