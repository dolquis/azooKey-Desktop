# 未署名 MSI リリース CI（M12 / DEV-415）
#
# タグ push（v*）で x64 の未署名 MSI をビルドし、Draft Release に添付する。
# MSI は per-machine 配置であり、TIP の machine-wide 登録に必要な昇格は
# Windows Installer が処理する。
#
# スタンドアロン MSIX と自前コード署名は延期中（DEV-255）。MS Store 用 MSIX は
# DEV-416 の別経路で扱い、この workflow へ署名ステップを混在させない。
#
# タグ push では成果物へ SBOM（SPDX）と build provenance の attestation を付与する
# （M38 供給網固定 / DEV-585）。attestation はリポジトリに残る公開記録のため、
# workflow_dispatch の dry-run では生成しない。
#
# 設計の正典は docs/sideload-packaging-spec.md §4。
# RELEASE_ENABLED が 'true' でない限り job 全体が skip され、誤発火しない。
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: # 未署名 MSI ビルドまでを手動 dry-run する。
permissions:
  contents: write # Draft Release の作成・添付に必要
  id-token: write # actions/attest が OIDC トークンで署名するのに必要
  attestations: write # attestation をリポジトリへ書き込むのに必要
jobs:
  release:
    name: Build unsigned MSI and draft release
    runs-on: windows-2022
    # 静的辞書層の生成（Python 製ビルダ、数分）を含む。
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Keep release objects separate from the ordinary CI cache namespace.
      SCCACHE_GHA_VERSION: "release-v1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    if: ${{ vars.RELEASE_ENABLED == 'true' }} # 人間が repository variable で有効化する。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # legacy/ 配下の macOS モデル submodule は Windows パッケージングに不要。
          # 既存 windows.yml と同じく無効化する（取得の遅延・脆弱性を避ける）。
          submodules: false
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Set up sccache
        id: sccache-setup
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # Disable unguarded post-action stats; report only after successful startup.
          disable_annotations: 'true'
      - name: Start sccache server
        id: sccache-start
        if: steps.sccache-setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: sccache --start-server
      - name: Fall back to uncached compilation
        if: steps.sccache-start.outcome != 'success'
        shell: bash
        run: echo "::warning::sccache setup or server startup failed; building without compiler cache."
      - name: Resolve MSI version
        id: msi-version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME.Substring(1)
          } else {
            $version = "0.0.0"
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $version"
          }

          $parts = @()
          foreach ($field in $version.Split('.')) {
            [uint32]$parsed = 0
            if (-not [uint32]::TryParse($field, [ref]$parsed)) {
              throw "MSI version field exceeds the supported integer range: $version"
            }
            $parts += $parsed
          }
          if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) {
            throw "MSI version must satisfy MAJOR <= 255, MINOR <= 255, PATCH <= 65535: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Configure
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.msi-version.outputs.version }}
        run: cmake -DAZOOKEY_USE_COMPILER_CACHE=${{ steps.sccache-start.outcome == 'success' && 'ON' || 'OFF' }} --preset windows-release -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_WIL=ON -DAZOOKEY_FETCH_LLAMA_CPP=ON "-DAZOOKEY_PRODUCT_VERSION=$env:PRODUCT_VERSION"
      # The settings custom target has its own MSBuild output/intermediate paths.
      # One Ninja invocation schedules it alongside the native default targets.
      - name: Build native targets and self-contained settings app
        run: cmake --build --preset windows-release --target all azookey_settings --parallel 2
      - name: Report sccache stats
        if: always() && steps.sccache-start.outcome == 'success'
        continue-on-error: true
        run: sccache --show-stats
      - name: Verify settings product version
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.msi-version.outputs.version }}
        run: |
          $path = (Resolve-Path build/windows-release/settings-app/Release/azookey_settings.exe -ErrorAction Stop).Path
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
          $expected = "$env:PRODUCT_VERSION.0"
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) {
            throw "Settings version mismatch: expected $expected, FileVersion=$($info.FileVersion), ProductVersion=$($info.ProductVersion)"
          }
      - name: Test
        run: ctest --preset windows-release --no-tests=error
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # 静的辞書層は SHA256 で固定した上流から毎回生成する（DEV-1487）。
      # 生の上流データは同梱せず、変換後の .azdic と ThirdPartyNotices.txt だけを MSI に入れる。
      - name: Build bundled dictionaries
        run: python dictbuild/build_bundled.py --output build\bundled-dictionaries --cache "${{ runner.temp }}\dictionary-sources"
      # 同一入力をキャッシュだけで再生成し、content_hash・全 bytes・通知の一致を検証する。
      - name: Rebuild bundled dictionaries offline
        run: python dictbuild/build_bundled.py --output build\bundled-dictionaries-repeated --cache "${{ runner.temp }}\dictionary-sources" --offline
      # standalone の neologd_lexicon pack 混入、層 ID と帰属の欠落、MSI 同梱一覧との差を検出する。
      - name: Check bundled dictionaries
        run: python dictbuild/check_bundle.py build\bundled-dictionaries --package pkg\msi\Package.wxs --compare build\bundled-dictionaries-repeated
      # 出荷する .azdic を Host と同じ C++ リーダーで読み、逆変換できることを確かめる。
      - name: Load bundled dictionaries with the host reader
        env:
          AZOOKEY_BUNDLED_DICTIONARY_DIR: ${{ github.workspace }}\build\bundled-dictionaries\dict
        run: ctest --preset windows-release -R ShippedBundleLoadsAndReverseConverts --no-tests=error --output-on-failure
      - name: Resolve app-local MSVC runtime
        id: vc-runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw "Visual Studio C++ tools were not found."
          }

          $redistRoot = Join-Path $installPath "VC\Redist\MSVC"
          $versionDir = Get-ChildItem $redistRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $crtDir = Get-ChildItem (Join-Path $versionDir.FullName "x64") -Directory |
            Where-Object { $_.Name -match '^Microsoft\.VC\d+\.CRT$' } |
            Select-Object -First 1
          if (-not $crtDir) {
            throw "The x64 MSVC runtime directory was not found under $redistRoot."
          }
          # ggml は既定で OpenMP を使うため、llama.cpp を組み込んだ Host は
          # VCOMP140.DLL を暗黙インポートする（DEV-1137）。CRT とは別 redist。
          $openMpDir = Get-ChildItem (Join-Path $versionDir.FullName "x64") -Directory |
            Where-Object { $_.Name -match '^Microsoft\.VC\d+\.OpenMP$' } |
            Select-Object -First 1
          if (-not $openMpDir) {
            throw "The x64 MSVC OpenMP runtime directory was not found under $redistRoot."
          }

          $runtimeSources = [ordered]@{
            "msvcp140.dll" = $crtDir.FullName
            "vcruntime140.dll" = $crtDir.FullName
            "vcruntime140_1.dll" = $crtDir.FullName
            "vcomp140.dll" = $openMpDir.FullName
          }
          $runtimeInfo = foreach ($name in $runtimeSources.Keys) {
            $path = Join-Path $runtimeSources[$name] $name
            if (-not (Test-Path $path)) {
              throw "Required MSVC runtime file is missing: $name"
            }
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($path)
            @{
              name = $name
              version = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          ConvertTo-Json -InputObject @($runtimeInfo) | Set-Content -Encoding utf8 runtime-info.json
          "dir=$($crtDir.FullName)" >> $env:GITHUB_OUTPUT
          "openmp-dir=$($openMpDir.FullName)" >> $env:GITHUB_OUTPUT
      # Package.wxs の同梱一覧は手書きなので、ビルド構成が増やしたランタイム依存が
      # 静かに漏れる。MSI をビルドする前に、配布する PE の import と突き合わせる。
      - name: Verify the MSI ships every imported MSVC runtime
        shell: pwsh
        run: |
          $settingsPayload = "${{ github.workspace }}\build\windows-release\settings-app\Release"
          ./scripts/check-app-local-runtime.ps1 `
            -BinaryPath `
              "${{ github.workspace }}\build\windows-release\tsf-tip\azookey_tsf_tip.dll", `
              "${{ github.workspace }}\build\windows-release\inference-host\azookey_inference_host.exe", `
              "${{ github.workspace }}\build\windows-release\tsf-tip\azookey_ime_switch.exe", `
              "$settingsPayload\azookey_settings.exe" `
            -PackagePath "${{ github.workspace }}\pkg\msi\Package.wxs" `
            -PayloadDirectory "$settingsPayload"
      - name: Build unsigned MSI
        run: >-
          dotnet build pkg\msi\azooKey.wixproj --configuration Release --output "${{ github.workspace }}\pkg\msi\bin\Release" -p:ProductVersion=${{ steps.msi-version.outputs.version }} "-p:VCRuntimeDir=${{ steps.vc-runtime.outputs.dir }}" "-p:VCOpenMPDir=${{ steps.vc-runtime.outputs.openmp-dir }}" "-p:SettingsPayloadDir=${{ github.workspace }}\build\windows-release\settings-app\Release" "-p:SettingsExePath=${{ github.workspace }}\build\windows-release\settings-app\Release\azookey_settings.exe" "-p:BundledDictionaryDir=${{ github.workspace }}\build\bundled-dictionaries"
      - name: Verify MSI is unsigned
        id: msi-artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem pkg\msi\bin\Release\*.msi -File -ErrorAction Stop
          if ($msi.Count -ne 1) {
            throw "Expected one MSI, found $($msi.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $msi.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Expected an unsigned MSI, found signature status $($signature.Status)."
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
      # syft の検出結果を保持し、CMake / NuGet / 同梱 CRT のビルド入力で補完する。
      # dry-run でも両ステップを実行する。attribution の正典は THIRD_PARTY_LICENSES。
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.msi-artifact.outputs.path }}
          format: spdx-json
          output-file: ${{ github.workspace }}\azooKey.syft.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Complete SBOM with release dependencies
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi-artifact.outputs.path }}
          VC_RUNTIME_DIR: ${{ steps.vc-runtime.outputs.dir }}
          VC_OPENMP_DIR: ${{ steps.vc-runtime.outputs.openmp-dir }}
          MSI_VERSION: ${{ steps.msi-version.outputs.version }}
        run: |
          git diff --exit-code -- settings-app/packages.lock.json
          if ($LASTEXITCODE -ne 0) { throw "Release restore changed the NuGet lock." }
          python scripts/complete-release-sbom.py `
            --input azooKey.syft.spdx.json --output azooKey.spdx.json `
            --build-dir build/windows-release --runtime-info runtime-info.json `
            --runtime-dir "$env:VC_RUNTIME_DIR" --runtime-dir "$env:VC_OPENMP_DIR" `
            --msi "$env:MSI_PATH" --version "$env:MSI_VERSION"
      # attestation はリポジトリに残る公開記録なので、実際に配布するタグ push で
      # だけ作る。dry-run で作ると未配布ビルドの証明が残り、誤解を生む。
      #
      # actions/attest-build-provenance と actions/attest-sbom は v4 で
      # actions/attest の wrapper になり、新規実装は actions/attest を使うよう
      # 案内されている。sbom-path も predicate も渡さなければ SLSA build
      # provenance、sbom-path を渡せば SBOM attestation になる。
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.msi-artifact.outputs.path }}
      - name: Attest SBOM
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.msi-artifact.outputs.path }}
          sbom-path: ${{ github.workspace }}\azooKey.spdx.json
      - name: Record Release asset sizes and hashes
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi-artifact.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @($env:MSI_PATH, 'azooKey.spdx.json')
          $rows = foreach ($path in $assets) {
            $file = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($file.Length -le 0) { throw "Release asset is empty: $($file.Name)" }
            $sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "| $($file.Name) | $($file.Length) | $sha256 |"
          }
          @(
            '## Release assets before upload'
            ''
            '| Asset | Bytes | SHA256 |'
            '|---|---:|---|'
          ) + $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload Release asset (draft)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            pkg\msi\bin\Release\*.msi
            azooKey.spdx.json

  # Base publication does not depend on this optional add-on.
  vulkan-addon:
    name: Build unsigned Vulkan add-on MSI
    runs-on: windows-2022
    timeout-minutes: 90
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "release-vulkan-v1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      # Keep both SDK pins aligned with windows.yml / windows-vulkan-compile.
      VULKAN_SDK_VERSION: "1.4.357.0"
      VULKAN_SDK_SHA256: "81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # legacy/ 配下の macOS モデル submodule は Windows パッケージングに不要。
          # 既存 windows.yml と同じく無効化する（取得の遅延・脆弱性を避ける）。
          submodules: false
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Set up sccache
        id: sccache-setup
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # Disable unguarded post-action stats; report only after successful startup.
          disable_annotations: 'true'
      - name: Start sccache server
        id: sccache-start
        if: steps.sccache-setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: sccache --start-server
      - name: Fall back to uncached compilation
        if: steps.sccache-start.outcome != 'success'
        shell: bash
        run: echo "::warning::sccache setup or server startup failed; building without compiler cache."
      - name: Resolve MSI version
        id: msi-version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME.Substring(1)
          } else {
            $version = "0.0.0"
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $version"
          }

          $parts = @()
          foreach ($field in $version.Split('.')) {
            [uint32]$parsed = 0
            if (-not [uint32]::TryParse($field, [ref]$parsed)) {
              throw "MSI version field exceeds the supported integer range: $version"
            }
            $parts += $parsed
          }
          if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) {
            throw "MSI version must satisfy MAJOR <= 255, MINOR <= 255, PATCH <= 65535: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Cache Vulkan SDK installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vulkan-sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-${{ env.VULKAN_SDK_SHA256 }}

      # LunarG の配布物を SHA256 で照合してから実行する（M38 供給網固定と同じ規律）。
      # --root でランナー作業領域へ入れるサイレントインストールで、昇格を伴わない。
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheDir = Join-Path $env:RUNNER_TEMP 'vulkan-sdk'
          $installer = Join-Path $cacheDir "vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          if (Test-Path -LiteralPath $installer) {
            $cachedSha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($cachedSha -ne $env:VULKAN_SDK_SHA256) {
              Remove-Item -LiteralPath $installer -Force
            }
          }
          if (-not (Test-Path -LiteralPath $installer)) {
            $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
            curl.exe --fail --location --retry 3 --output $installer $url
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $actualSha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $env:VULKAN_SDK_SHA256) {
            throw "Vulkan SDK installer SHA256 mismatch: expected $env:VULKAN_SDK_SHA256, got $actualSha"
          }

          # インストーラーは GUI サブシステムの実行体なので、& 演算子では終了を
          # 待たないことがある。Start-Process -Wait で完了と exit code を確定させる。
          $root = Join-Path $env:RUNNER_TEMP "VulkanSDK\$env:VULKAN_SDK_VERSION"
          $arguments = @('--root', $root, '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          $install = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK install failed with exit code $($install.ExitCode)" }
          # ggml-vulkan は glslc と SPIRV-Headers の CMake config を SDK から引く。
          foreach ($required in "Bin\glslc.exe", "Include\vulkan\vulkan.h", "Lib\vulkan-1.lib") {
            $path = Join-Path $root $required
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Vulkan SDK is missing a required component: $required"
            }
          }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          Join-Path $root 'Bin' >> $env:GITHUB_PATH

      - name: Configure Vulkan build
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.msi-version.outputs.version }}
        run: cmake -DAZOOKEY_USE_COMPILER_CACHE=${{ steps.sccache-start.outcome == 'success' && 'ON' || 'OFF' }} --preset windows-vulkan-release -DAZOOKEY_FETCH_WIL=ON -DAZOOKEY_BUILD_TESTS=OFF -DAZOOKEY_BUILD_BENCH=OFF -DAZOOKEY_FETCH_GOOGLETEST=OFF "-DAZOOKEY_PRODUCT_VERSION=$env:PRODUCT_VERSION"
      - name: Build inference host with ggml-vulkan
        run: cmake --build --preset windows-vulkan-release --target azookey_inference_host --parallel 2
      - name: Report sccache stats
        if: always() && steps.sccache-start.outcome == 'success'
        continue-on-error: true
        run: sccache --show-stats
      - name: Verify the Vulkan host links the loader implicitly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build\vk\inference-host\azookey_inference_host.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Vulkan host executable was not produced: $exe"
          }
          $dependents = & dumpbin /nologo /dependents $exe | Out-String
          $dependents
          if ($dependents -notmatch '(?im)^\s*vulkan-1\.dll\s*$') {
            throw "azookey_inference_host.exe no longer imports vulkan-1.dll; revisit the add-on layout in docs/sideload-packaging-spec.md 1.6.3"
          }

      - name: Copy the Vulkan host for packaging
        shell: pwsh
        run: Copy-Item build\vk\inference-host\azookey_inference_host.exe build\vk\inference-host\azookey_inference_host_vulkan.exe
      - name: Verify the base MSI covers the imported MSVC runtime
        shell: pwsh
        run: ./scripts/check-app-local-runtime.ps1 -BinaryPath "${{ github.workspace }}\build\vk\inference-host\azookey_inference_host_vulkan.exe" -PackagePath "${{ github.workspace }}\pkg\msi\Package.wxs"
      - name: Build unsigned Vulkan add-on MSI
        run: >-
          dotnet build pkg\msi-vulkan\azooKey.VulkanAddon.wixproj --configuration Release --output "${{ github.workspace }}\pkg\msi-vulkan\bin\Release" -p:ProductVersion=${{ steps.msi-version.outputs.version }} "-p:VulkanHostExePath=${{ github.workspace }}\build\vk\inference-host\azookey_inference_host_vulkan.exe"
      - name: Verify MSI is unsigned
        id: addon-artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem pkg\msi-vulkan\bin\Release\*.msi -File -ErrorAction Stop
          if ($msi.Count -ne 1) {
            throw "Expected one MSI, found $($msi.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $msi.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Expected an unsigned MSI, found signature status $($signature.Status)."
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.addon-artifact.outputs.path }}
          format: spdx-json
          output-file: ${{ github.workspace }}\azooKey-vulkan-addon.syft.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Complete Vulkan add-on SBOM with release dependencies
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.addon-artifact.outputs.path }}
          MSI_VERSION: ${{ steps.msi-version.outputs.version }}
        run: >-
          python scripts/complete-release-sbom.py --package vulkan-addon --vulkan-sdk "$env:VULKAN_SDK" --input azooKey-vulkan-addon.syft.spdx.json --output azooKey-vulkan-addon.spdx.json --build-dir build/vk --msi "$env:MSI_PATH" --version "$env:MSI_VERSION"
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.addon-artifact.outputs.path }}
      - name: Attest SBOM
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.addon-artifact.outputs.path }}
          sbom-path: ${{ github.workspace }}\azooKey-vulkan-addon.spdx.json
      - name: Record Release asset sizes and hashes
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.addon-artifact.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @($env:MSI_PATH, 'azooKey-vulkan-addon.spdx.json')
          $rows = foreach ($path in $assets) {
            $file = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($file.Length -le 0) { throw "Release asset is empty: $($file.Name)" }
            $sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "| $($file.Name) | $($file.Length) | $sha256 |"
          }
          @(
            '## Vulkan add-on assets before upload'
            ''
            '| Asset | Bytes | SHA256 |'
            '|---|---:|---|'
          ) + $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Save Vulkan add-on assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulkan-addon
          if-no-files-found: error
          path: |
            pkg\msi-vulkan\bin\Release\*.msi
            azooKey-vulkan-addon.spdx.json

  attach-vulkan-addon:
    needs: [release, vulkan-addon]
    if: ${{ always() && vars.RELEASE_ENABLED == 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Report unavailable Vulkan add-on
        if: needs.vulkan-addon.result != 'success'
        env:
          ADDON_RESULT: ${{ needs.vulkan-addon.result }}
        run: |
          echo "Vulkan add-on was not attached: vulkan-addon job result=$ADDON_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Download Vulkan add-on assets
        if: needs.vulkan-addon.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vulkan-addon
      - name: Attach Vulkan add-on to the base draft release
        if: needs.vulkan-addon.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pkg/msi-vulkan/bin/Release/*.msi azooKey-vulkan-addon.spdx.json --repo "$GITHUB_REPOSITORY"
      - name: Report dry-run
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Vulkan add-on was not attached because this is a dry-run.' >> "$GITHUB_STEP_SUMMARY"
