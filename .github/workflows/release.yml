# 未署名 MSI リリース CI（M12 / DEV-415）
#
# タグ push（v*）で x64 の未署名 MSI をビルドし、Draft Release に添付する。
# MSI は per-machine 配置であり、TIP の machine-wide 登録に必要な昇格は
# Windows Installer が処理する。
#
# スタンドアロン MSIX と自前コード署名は延期中（DEV-255）。MS Store 用 MSIX は
# DEV-416 の別経路で扱い、この workflow へ署名ステップを混在させない。
#
# タグ push では成果物へ SBOM（SPDX）と build provenance の attestation を付与する
# （M38 供給網固定 / DEV-585）。attestation はリポジトリに残る公開記録のため、
# workflow_dispatch の dry-run では生成しない。
#
# 設計の正典は docs/sideload-packaging-spec.md §4。
# RELEASE_ENABLED が 'true' でない限り job 全体が skip され、誤発火しない。
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: # 未署名 MSI ビルドまでを手動 dry-run する。
permissions:
  contents: write # Draft Release の作成・添付に必要
  id-token: write # actions/attest が OIDC トークンで署名するのに必要
  attestations: write # attestation をリポジトリへ書き込むのに必要
jobs:
  release:
    name: Build unsigned MSI and draft release
    runs-on: windows-2022
    timeout-minutes: 45
    if: ${{ vars.RELEASE_ENABLED == 'true' }} # 人間が repository variable で有効化する。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # legacy/ 配下の macOS モデル submodule は Windows パッケージングに不要。
          # 既存 windows.yml と同じく無効化する（取得の遅延・脆弱性を避ける）。
          submodules: false
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure
        run: cmake --preset windows-release -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_WIL=ON -DAZOOKEY_FETCH_LLAMA_CPP=ON
      - name: Build
        run: cmake --build --preset windows-release --parallel 1
      - name: Build self-contained settings app
        run: cmake --build --preset windows-release --target azookey_settings --parallel 1
      - name: Test
        run: ctest --preset windows-release --no-tests=error
      - name: Resolve MSI version
        id: msi-version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME.Substring(1)
          } else {
            $version = "0.0.0"
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $version"
          }

          $parts = @()
          foreach ($field in $version.Split('.')) {
            [uint32]$parsed = 0
            if (-not [uint32]::TryParse($field, [ref]$parsed)) {
              throw "MSI version field exceeds the supported integer range: $version"
            }
            $parts += $parsed
          }
          if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) {
            throw "MSI version must satisfy MAJOR <= 255, MINOR <= 255, PATCH <= 65535: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Resolve app-local MSVC runtime
        id: vc-runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            throw "Visual Studio C++ tools were not found."
          }

          $redistRoot = Join-Path $installPath "VC\Redist\MSVC"
          $versionDir = Get-ChildItem $redistRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          $crtDir = Get-ChildItem (Join-Path $versionDir.FullName "x64") -Directory |
            Where-Object { $_.Name -match '^Microsoft\.VC\d+\.CRT$' } |
            Select-Object -First 1
          if (-not $crtDir) {
            throw "The x64 MSVC runtime directory was not found under $redistRoot."
          }

          foreach ($name in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            if (-not (Test-Path (Join-Path $crtDir.FullName $name))) {
              throw "Required MSVC runtime file is missing: $name"
            }
          }
          "dir=$($crtDir.FullName)" >> $env:GITHUB_OUTPUT
      - name: Build unsigned MSI
        run: >-
          dotnet build pkg\msi\azooKey.wixproj --configuration Release -p:ProductVersion=${{ steps.msi-version.outputs.version }} "-p:VCRuntimeDir=${{ steps.vc-runtime.outputs.dir }}" "-p:SettingsPayloadDir=${{ github.workspace }}\build\windows-release\settings-app\Release" "-p:SettingsExePath=${{ github.workspace }}\build\windows-release\settings-app\Release\azookey_settings.exe"
      - name: Verify MSI is unsigned
        id: msi-artifact
        shell: pwsh
        run: |
          $msi = Get-ChildItem pkg\msi\bin\Release\*.msi -File -ErrorAction Stop
          if ($msi.Count -ne 1) {
            throw "Expected one MSI, found $($msi.Count)."
          }
          $signature = Get-AuthenticodeSignature -FilePath $msi.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Expected an unsigned MSI, found signature status $($signature.Status)."
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
      # syft は MSI から C++ の依存関係を復元できない。この SBOM が担保するのは
      # 成果物そのものの同定であり、FetchContent 取得の llama.cpp / WIL 等を列挙
      # する正典は引き続き THIRD_PARTY_LICENSES である（docs/licensing-policy.md）。
      # dry-run でも生成し、ステップ自体の破損を早期に検出する。
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.msi-artifact.outputs.path }}
          format: spdx-json
          output-file: ${{ github.workspace }}\azooKey.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # attestation はリポジトリに残る公開記録なので、実際に配布するタグ push で
      # だけ作る。dry-run で作ると未配布ビルドの証明が残り、誤解を生む。
      #
      # actions/attest-build-provenance と actions/attest-sbom は v4 で
      # actions/attest の wrapper になり、新規実装は actions/attest を使うよう
      # 案内されている。sbom-path も predicate も渡さなければ SLSA build
      # provenance、sbom-path を渡せば SBOM attestation になる。
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.msi-artifact.outputs.path }}
      - name: Attest SBOM
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.msi-artifact.outputs.path }}
          sbom-path: ${{ github.workspace }}\azooKey.spdx.json
      - name: Upload Release asset (draft)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            pkg\msi\bin\Release\*.msi
            azooKey.spdx.json
