name: Release SBOM tests
on:
  pull_request:
    paths:
      - 'scripts/complete-release-sbom.py'
      - 'scripts/tests/test_release_sbom.py'
      - 'scripts/tests/fixtures/release-msi.syft.spdx.json'
      - 'THIRD_PARTY_LICENSES'
      - 'CMakeLists.txt'
      - 'settings-app/packages.lock.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/sbom.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/complete-release-sbom.py'
      - 'scripts/tests/test_release_sbom.py'
      - 'scripts/tests/fixtures/release-msi.syft.spdx.json'
      - 'THIRD_PARTY_LICENSES'
      - 'CMakeLists.txt'
      - 'settings-app/packages.lock.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/sbom.yml'
permissions:
  contents: read
concurrency:
  group: sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sbom:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test release SBOM and attribution coverage
        run: python scripts/tests/test_release_sbom.py
