name: Release SBOM tests
on:
  pull_request:
    paths:
      - 'scripts/complete-release-sbom.py'
      - 'scripts/tests/test_release_sbom.py'
      - 'scripts/tests/fixtures/release-msi.syft.spdx.json'
      - 'THIRD_PARTY_LICENSES'
      - 'CMakeLists.txt'
      - 'settings-app/packages.lock.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/sbom.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/complete-release-sbom.py'
      - 'scripts/tests/test_release_sbom.py'
      - 'scripts/tests/fixtures/release-msi.syft.spdx.json'
      - 'THIRD_PARTY_LICENSES'
      - 'CMakeLists.txt'
      - 'settings-app/packages.lock.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/sbom.yml'
permissions:
  contents: read
concurrency:
  group: sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sbom:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test release SBOM and attribution coverage
        run: python scripts/tests/test_release_sbom.py
