name: Release SBOM tests
on:
  pull_request:
    paths:
      - 'scripts/complete-release-sbom.py'
      - 'scripts/tests/test_release_sbom.py'
      - 'THIRD_PARTY_LICENSES'
      - 'CMakeLists.txt'
      - 'settings-app/packages.lock.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/sbom.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/complete-release-sbom.py'
      - 'scripts/tests/test_release_sbom.py'
      - 'THIRD_PARTY_LICENSES'
      - 'CMakeLists.txt'
      - 'settings-app/packages.lock.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/sbom.yml'
permissions:
  contents: read
concurrency:
  group: sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test release SBOM and attribution coverage
        run: python scripts/tests/test_release_sbom.py
