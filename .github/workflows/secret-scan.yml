name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Pull requests compare the complete base..head commit range.
          fetch-depth: 0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/azookey-secret-scan/bin"
          mkdir -p "$bin_dir"
          GOBIN="$bin_dir" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify the secret scanner rejects a dummy secret
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/gitleaks-self-test"
          mkdir -p "$fixture_dir"
          printf 'token=%s\n' "gl""pat-A1b2C3d4E5f6G7h8I9j0" \
            > "$fixture_dir/dummy.txt"
          set +e
          gitleaks dir "$fixture_dir" --no-banner --redact --exit-code 23
          status=$?
          set -e
          if [ "$status" -ne 23 ]; then
            echo "::error::gitleaks self-test expected exit 23, got $status"
            exit 1
          fi

      - name: Scan secrets outside the staged pre-commit hook
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            gitleaks git --log-opts="${PR_BASE}..HEAD" --no-banner --redact
          else
            gitleaks dir . --no-banner --redact
          fi
