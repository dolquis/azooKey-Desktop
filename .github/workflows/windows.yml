name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  windows-build:
    name: Windows ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-debug
          - config: Release
            preset: windows-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache GoogleTest source
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: googletest-v1.17.0-${{ runner.os }}-${{ matrix.config }}

      - name: Configure
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DAZOOKEY_FETCH_GOOGLETEST=ON 2>&1 | Tee-Object -FilePath configure-${{ matrix.config }}.log
          "configure_ec=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} 2>&1 | Tee-Object -FilePath build-${{ matrix.config }}.log
          "build_ec=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run tests via CTest
        id: run_tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} --no-tests=error 2>&1 | Tee-Object -FilePath test-report-${{ matrix.config }}.md
          "tests_ec=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Post diagnostic comment to PR
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(not produced)';
            const config = '${{ matrix.config }}';
            const configureLog = readSafe(`configure-${config}.log`);
            const buildLog = readSafe(`build-${config}.log`);
            const testReport = readSafe(`test-report-${config}.md`);
            const truncate = (s, n) => s.length > n ? s.slice(-n) + '\n...[truncated]' : s;
            const body = [
              `## Windows ${config} CI diagnostic (run ${context.runId})`,
              '',
              `### Configure (tail)`,
              '```',
              truncate(configureLog, 4000),
              '```',
              `### Build (tail)`,
              '```',
              truncate(buildLog, 6000),
              '```',
              `### Tests`,
              '```',
              truncate(testReport, 6000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.config }}-logs
          path: |
            configure-${{ matrix.config }}.log
            build-${{ matrix.config }}.log
            test-report-${{ matrix.config }}.md
          if-no-files-found: ignore

      - name: Upload Release symbols
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-pdb
          path: build/${{ matrix.preset }}/**/*.pdb
          if-no-files-found: ignore

      - name: Fail if any step failed
        shell: pwsh
        run: |
          $cfg = '${{ steps.configure.outputs.configure_ec }}'
          $bld = '${{ steps.build.outputs.build_ec }}'
          $tst = '${{ steps.run_tests.outputs.tests_ec }}'
          Write-Host "configure_ec=$cfg build_ec=$bld tests_ec=$tst"
          if ($cfg -ne '0' -or $bld -ne '0' -or $tst -ne '0') { exit 1 }

  linux-build:
    name: Linux Debug
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset linux-debug -DAZOOKEY_FETCH_GOOGLETEST=ON

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Run tests via CTest
        run: ctest --preset linux-debug --no-tests=error
