name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  settings-schema:
    name: Settings JSON Schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema==0.37.3

      - name: Validate settings schemas
        run: check-jsonschema --check-metaschema settings/mvp-settings.schema.json settings/model-catalog.schema.json

      - name: Validate default settings sample
        run: check-jsonschema --schemafile settings/mvp-settings.schema.json settings/default-settings.sample.json

  windows-build:
    name: Windows ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-debug
          - config: Release
            preset: windows-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache GoogleTest source
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: googletest-v1.17.0-${{ runner.os }}-${{ matrix.config }}

      - name: Configure
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DAZOOKEY_FETCH_GOOGLETEST=ON 2>&1 | Tee-Object -FilePath configure-${{ matrix.config }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} 2>&1 | Tee-Object -FilePath build-${{ matrix.config }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests via CTest
        id: run_tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} --no-tests=error 2>&1 | Tee-Object -FilePath test-report-${{ matrix.config }}.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Post diagnostic comment to PR
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(not produced)';
            const config = '${{ matrix.config }}';
            const configureLog = readSafe(`configure-${config}.log`);
            const buildLog = readSafe(`build-${config}.log`);
            const testReport = readSafe(`test-report-${config}.md`);
            const truncate = (s, n) => s.length > n ? s.slice(-n) + '\n...[truncated]' : s;
            const body = [
              `## Windows ${config} CI diagnostic (run ${context.runId})`,
              '',
              `### Configure (tail)`,
              '```',
              truncate(configureLog, 4000),
              '```',
              `### Build (tail)`,
              '```',
              truncate(buildLog, 6000),
              '```',
              `### Tests`,
              '```',
              truncate(testReport, 6000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.config }}-logs
          path: |
            configure-${{ matrix.config }}.log
            build-${{ matrix.config }}.log
            test-report-${{ matrix.config }}.md
          if-no-files-found: ignore

      - name: Upload Release symbols
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-pdb
          path: build/${{ matrix.preset }}/**/*.pdb
          if-no-files-found: ignore

      - name: Fail if configure, build, or tests failed
        if: always()
        shell: pwsh
        run: |
          $results = [ordered]@{
            Configure = '${{ steps.configure.outcome }}'
            Build = '${{ steps.build.outcome }}'
            Tests = '${{ steps.run_tests.outcome }}'
          }
          $failed = @()
          foreach ($entry in $results.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
            if ($entry.Value -ne 'success') {
              $failed += $entry.Key
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed CI phases: $($failed -join ', ')"
            exit 1
          }

  windows-llama-build:
    name: Windows llama.cpp compile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/windows-llama/_deps
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure llama.cpp build
        shell: pwsh
        run: |
          cmake -S . -B build/windows-llama -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAZOOKEY_BUILD_TESTS=ON -DAZOOKEY_BUILD_BENCH=OFF -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_LLAMA_CPP=ON 2>&1 | Tee-Object -FilePath configure-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build host tests with llama.cpp
        shell: pwsh
        run: |
          cmake --build build/windows-llama --target host_engine_tests --parallel 1 2>&1 | Tee-Object -FilePath build-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload llama.cpp build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-llama-build-logs
          path: |
            configure-llama.log
            build-llama.log
          if-no-files-found: ignore

  linux-build:
    name: Linux Debug
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Cache GoogleTest source
        uses: actions/cache@v4
        with:
          path: build/linux-debug/_deps
          key: googletest-v1.17.0-${{ runner.os }}-Debug
          restore-keys: |
            googletest-v1.17.0-${{ runner.os }}-

      - name: Configure
        run: cmake --preset linux-debug -DAZOOKEY_FETCH_GOOGLETEST=ON

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Run tests via CTest
        run: ctest --preset linux-debug --no-tests=error
