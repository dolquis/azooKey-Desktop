name: Build

on:
  push:
    branches: [main]
    # ドキュメント・計画・エージェント設定・legacy 参照資産だけの変更ではビルド系
    # ジョブを起動しない。branch protection 未設定のためワークフローレベルの
    # paths-ignore で足りる（required checks を導入する場合は changes + ci-gate 構成へ）。
    # ワークフロー自身（.github/workflows/**）やコードは無視パターンに含めないため
    # 変更時は通常どおり CI が走る。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - 'legacy/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - 'legacy/**'
  workflow_dispatch:

# 既定は最小権限。PR への診断コメント投稿に必要な pull-requests: write は、それを
# 行う windows-build ジョブにのみ付与する（下記ジョブ単位 permissions）。
permissions:
  contents: read

# CI 高速化: 同一 PR / ブランチで新しい push が来たら進行中の run を畳む。
# main への push は畳まない（各コミットのビルドを残す）ため PR イベント限定で
# cancel-in-progress を有効化する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  settings-schema:
    name: Settings JSON Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema==0.37.3

      - name: Validate settings schemas
        run: check-jsonschema --check-metaschema settings/mvp-settings.schema.json settings/model-catalog.schema.json

      - name: Validate default settings sample
        run: check-jsonschema --schemafile settings/mvp-settings.schema.json settings/default-settings.sample.json

  powershell-quality:
    name: PowerShell lint/test
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $pester = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester -or $pester.Version -lt [version]'5.0.0') {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run PSScriptAnalyzer and Pester
        shell: pwsh
        run: ./scripts/test-powershell-quality.ps1

  windows-build:
    name: Windows ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 45
    # このジョブだけが PR へ診断コメントを投稿するため pull-requests: write を持つ。
    # 他ジョブはワークフロー既定の contents: read のみ。
    permissions:
      contents: read
      pull-requests: write
    env:
      # The root CMakeLists auto-detects sccache on PATH and wires it as the
      # compiler launcher (flipping MSVC Debug info to /Z7 Embedded for cache
      # compatibility). SCCACHE_GHA_ENABLED stores objects in the Actions cache.
      SCCACHE_GHA_ENABLED: "true"
      # Resilience: if the cache backend errors at runtime, fall back to direct
      # compilation instead of failing the build (a cache must never break CI).
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-debug
          - config: Release
            preset: windows-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # v0.0.10 wires the current (v2) Actions cache service. Older tags (e.g.
      # v0.0.6) only export the legacy ACTIONS_CACHE_URL (v1), which GitHub
      # retired on 2025-04-15 — that returns HTTP 400 and fails sccache startup.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache GoogleTest source
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: googletest-v1.17.0-${{ runner.os }}-${{ matrix.config }}

      - name: Configure
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_WIL=ON 2>&1 | Tee-Object -FilePath configure-${{ matrix.config }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} 2>&1 | Tee-Object -FilePath build-${{ matrix.config }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ matrix.config }}" -eq "Release") {
            cmake --build --preset ${{ matrix.preset }} --target azookey_settings 2>&1 | Tee-Object -Append -FilePath build-${{ matrix.config }}.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # 成果物から RT_MANIFEST を取り出して <msix> identity を確認する（DEV-101 / M28）。
      # CMake 配線の静的チェックだけでは「埋め込みが実際に効いているか」は分からず、
      # 外れても症状は実機（Package.Current が null）でしか出ないため、ビルド直後に落とす。
      - name: Verify MSIX identity embedding
        id: verify_identity
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/verify-msix-identity-embedding.ps1 -ExePath build/${{ matrix.preset }}/inference-host/azookey_inference_host.exe

      - name: Report sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Run tests via CTest
        id: run_tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} --no-tests=error 2>&1 | Tee-Object -FilePath test-report-${{ matrix.config }}.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 失敗時のみ投稿する（dev-infra spec §4 の基盤定義は「失敗時 PR コメント +
      # test_report artifact」。成功時はログ artifact で十分で、毎 push の成功
      # コメントは PR を埋めるノイズになるため）。
      - name: Post diagnostic comment to PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          !github.event.pull_request.head.repo.fork &&
          (steps.configure.outcome != 'success' ||
           steps.build.outcome != 'success' ||
           steps.run_tests.outcome != 'success')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(not produced)';
            const config = '${{ matrix.config }}';
            const configureLog = readSafe(`configure-${config}.log`);
            const buildLog = readSafe(`build-${config}.log`);
            const testReport = readSafe(`test-report-${config}.md`);
            const truncate = (s, n) => s.length > n ? s.slice(-n) + '\n...[truncated]' : s;
            const body = [
              `## Windows ${config} CI diagnostic (run ${context.runId})`,
              '',
              `### Configure (tail)`,
              '```',
              truncate(configureLog, 4000),
              '```',
              `### Build (tail)`,
              '```',
              truncate(buildLog, 6000),
              '```',
              `### Tests`,
              '```',
              truncate(testReport, 6000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.config }}-logs
          path: |
            configure-${{ matrix.config }}.log
            build-${{ matrix.config }}.log
            test-report-${{ matrix.config }}.md
          if-no-files-found: ignore

      - name: Upload Release symbols
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-pdb
          path: build/${{ matrix.preset }}/**/*.pdb
          if-no-files-found: ignore

      - name: Fail if configure, build, or tests failed
        if: always()
        shell: pwsh
        run: |
          $results = [ordered]@{
            Configure = '${{ steps.configure.outcome }}'
            Build = '${{ steps.build.outcome }}'
            MsixIdentity = '${{ steps.verify_identity.outcome }}'
            Tests = '${{ steps.run_tests.outcome }}'
          }
          $failed = @()
          foreach ($entry in $results.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
            # MsixIdentity は Build 失敗時に skipped になる。その場合は Build 自体が
            # 失敗として計上されるため、skipped を重ねて報告しない。
            if ($entry.Value -ne 'success' -and $entry.Value -ne 'skipped') {
              $failed += $entry.Key
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed CI phases: $($failed -join ', ')"
            exit 1
          }

  windows-llama-build:
    name: Windows llama.cpp real-model smoke
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/windows-llama/_deps
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache pinned Zenzai model
        uses: actions/cache@v4
        with:
          path: build/model-cache
          key: zenz-v3.2-small-gguf-c67e03e0-q5-k-m-29c223d4

      - name: Download and verify pinned Zenzai model
        shell: pwsh
        run: |
          $modelDir = Join-Path $PWD "build/model-cache"
          $modelPath = Join-Path $modelDir "ggml-model-Q5_K_M.gguf"
          $expectedSha = "29c223d4c23327b80fd13ebb5ab2555057a46317997d5da391584ffbef0db673"
          $modelUrl = "https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/c67e03e07d215c869f591b274c1631170d3e11fe/ggml-model-Q5_K_M.gguf"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          if (Test-Path -LiteralPath $modelPath) {
            $cachedSha = (Get-FileHash -LiteralPath $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($cachedSha -ne $expectedSha) {
              Remove-Item -LiteralPath $modelPath -Force
            }
          }
          if (-not (Test-Path -LiteralPath $modelPath)) {
            curl.exe --fail --location --retry 3 --output $modelPath $modelUrl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $actualSha = (Get-FileHash -LiteralPath $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "Zenzai model SHA256 mismatch: expected $expectedSha, got $actualSha"
          }
          "AZOOKEY_REAL_MODEL=$modelPath" >> $env:GITHUB_ENV

      - name: Configure llama.cpp build
        shell: pwsh
        run: |
          $cmakeModelPath = $env:AZOOKEY_REAL_MODEL.Replace('\', '/')
          cmake -S . -B build/windows-llama -G Ninja -DCMAKE_BUILD_TYPE=Release -DAZOOKEY_BUILD_TESTS=ON -DAZOOKEY_BUILD_BENCH=ON -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_WIL=ON -DAZOOKEY_FETCH_LLAMA_CPP=ON "-DAZOOKEY_ZENZAI_TEST_MODEL=$cmakeModelPath" 2>&1 | Tee-Object -FilePath configure-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build host tests and Zenzai bench with llama.cpp
        shell: pwsh
        run: |
          cmake --build build/windows-llama --target host_engine_tests azookey_zenzai_bench --parallel 1 2>&1 | Tee-Object -FilePath build-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pinned real-model smoke via CTest
        shell: pwsh
        run: |
          ctest --test-dir build/windows-llama -L zenzai-real-model --verbose --no-tests=error 2>&1 | Tee-Object -FilePath test-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testLog = Get-Content -Raw -LiteralPath test-llama.log
          if ($testLog -notmatch 'model_loaded=1') {
            throw "Real-model smoke did not report model_loaded=1"
          }
          if ($testLog -notmatch 'zenzai_candidates=[1-9][0-9]*') {
            throw "Real-model smoke did not report any Zenzai candidates"
          }
          if ($testLog -notmatch 'top_surface=日本語 top_debug_info=') {
            throw "Real-model smoke did not convert にほんご exactly to 日本語"
          }
          if ($testLog -notmatch 'top_surface=私は学生です top_debug_info=') {
            throw "Real-model smoke did not convert わたしはがくせいです exactly to 私は学生です"
          }
          if ($testLog -notmatch 'prompt_token_ids=172,120,202,444,677,259,796,172,120,203') {
            throw "Real-model smoke token IDs did not match the pinned reference for にほんご"
          }
          if ($testLog -notmatch 'prompt_token_ids=172,120,202,628,327,330,623,643,299,492,280,406,271,172,120,203') {
            throw "Real-model smoke token IDs did not match the pinned reference for わたしはがくせいです"
          }
          if ($testLog -match 'utf8-prefix-trimmed') {
            throw "Real-model smoke observed utf8-prefix-trimmed after EOS handling"
          }

      - name: Report sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Upload llama.cpp build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-llama-build-logs
          path: |
            configure-llama.log
            build-llama.log
            test-llama.log
          if-no-files-found: ignore

  linux-build:
    name: Linux Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache GoogleTest source
        uses: actions/cache@v4
        with:
          path: build/linux-debug/_deps
          key: googletest-v1.17.0-${{ runner.os }}-Debug
          restore-keys: |
            googletest-v1.17.0-${{ runner.os }}-

      - name: Configure
        run: cmake --preset linux-debug -DAZOOKEY_FETCH_GOOGLETEST=ON

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run tests via CTest
        run: ctest --preset linux-debug --no-tests=error

  # cpp-quality was a single sequential job (format then tidy). It is split into
  # two independent jobs so the required format gate and the advisory tidy run
  # concurrently — the required gate fails fast without waiting on the slower
  # tidy configure step (dev-infra spec §4.3/§11.5).
  cpp-format:
    name: C++ format (changed-lines gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # Need the PR base commit so the changed-lines gate can diff against it.
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      # Required gate. Enforces .clang-format on newly added/changed lines only
      # (dev-infra spec M37 acceptance: clang-format is zero-diff for new code).
      # A whole-tree reformat + full-tree gate is tracked separately so this PR
      # does not fail on pre-existing formatting debt (spec §2.3/§4.3).
      - name: clang-format changed-lines gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          # Fall back to the previous commit for new branches / force pushes where
          # the reported base is absent or the zero SHA.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Comparing changed lines against $BASE"
          DIFF="$(git-clang-format-18 --binary clang-format-18 --diff \
            --extensions cpp,cc,h,hpp "$BASE" -- \
            core ipc learning inference-host tsf-tip bench)"
          if [ "$DIFF" = "no modified files to format" ] || \
             [ "$DIFF" = "clang-format did not modify any files" ]; then
            echo "clang-format: changed lines are clean."
            exit 0
          fi
          echo "clang-format found violations on changed lines:"
          printf '%s\n' "$DIFF"
          echo "::error::Run 'just format' (or clang-format) on your changes."
          exit 1

  cpp-tidy:
    name: C++ tidy (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # Need the PR base commit so the changed-files diff can target it.
          fetch-depth: 0

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-tidy-18

      # Advisory only (dev-infra spec §11.5: clang-tidy is an optional extension,
      # not a required gate). Surfaces static-analysis findings on changed files
      # without failing the build; never blocks a PR.
      - name: clang-tidy changed files (advisory)
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          # Offline configure only to emit compile_commands.json (tests excluded;
          # keeps the offline-build principle, spec §1). tsf-tip is Windows-only
          # and absent from the Linux DB, so it is naturally skipped here.
          cmake --preset linux-debug -DAZOOKEY_FETCH_GOOGLETEST=OFF >/dev/null
          CHANGED="$(git diff --name-only --diff-filter=ACM "$BASE" HEAD \
            | grep -E '^(core|ipc|learning|inference-host|bench)/.*\.(cpp|cc)$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "clang-tidy: no changed C++ source files in the portable subset."
            exit 0
          fi
          echo "Running clang-tidy on:"
          printf '%s\n' "$CHANGED"
          clang-tidy-18 -p build/linux-debug $CHANGED || true
