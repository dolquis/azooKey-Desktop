name: Windows Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache GoogleTest source
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: googletest-v1.17.0-${{ runner.os }}

      - name: Configure
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug 2>&1 | Tee-Object -FilePath configure.log
          "configure_ec=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          "build_ec=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run tests via CTest
        id: run_tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error 2>&1 | Tee-Object -FilePath test_report.md
          "tests_ec=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Post diagnostic comment to PR
        if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(not produced)';
            const configureLog = readSafe('configure.log');
            const buildLog = readSafe('build.log');
            const testReport = readSafe('test_report.md');
            const truncate = (s, n) => s.length > n ? s.slice(-n) + '\n...[truncated]' : s;
            const body = [
              `## Windows CI diagnostic (run ${context.runId})`,
              '',
              `### Configure (tail)`,
              '```',
              truncate(configureLog, 4000),
              '```',
              `### Build (tail)`,
              '```',
              truncate(buildLog, 6000),
              '```',
              `### Tests`,
              '```',
              truncate(testReport, 6000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_report.md
          if-no-files-found: ignore

      - name: Fail if any step failed
        shell: pwsh
        run: |
          $cfg = '${{ steps.configure.outputs.configure_ec }}'
          $bld = '${{ steps.build.outputs.build_ec }}'
          $tst = '${{ steps.run_tests.outputs.tests_ec }}'
          Write-Host "configure_ec=$cfg build_ec=$bld tests_ec=$tst"
          if ($cfg -ne '0' -or $bld -ne '0' -or $tst -ne '0') { exit 1 }
