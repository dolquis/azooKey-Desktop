name: Build

on:
  push:
    branches: [main]
    # ドキュメント・計画・エージェント設定・legacy 参照資産だけの変更ではビルド系
    # ジョブを起動しない。branch protection 未設定のためワークフローレベルの
    # paths-ignore で足りる（required checks を導入する場合は changes + ci-gate 構成へ）。
    # ワークフロー自身（.github/workflows/**）やコードは無視パターンに含めないため
    # 変更時は通常どおり CI が走る。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - 'legacy/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'plans/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - 'legacy/**'
  workflow_dispatch:

# 既定は最小権限。PR への診断コメント投稿に必要な pull-requests: write は、それを
# 行う windows-build ジョブにのみ付与する（下記ジョブ単位 permissions）。
permissions:
  contents: read

# CI 高速化: 同一 PR / ブランチで新しい push が来たら進行中の run を畳む。
# main への push は畳まない（各コミットのビルドを残す）ため PR イベント限定で
# cancel-in-progress を有効化する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect specialized job changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      settings_schema: ${{ steps.filter.outputs.settings_schema }}
      powershell_quality: ${{ steps.filter.outputs.powershell_quality }}
      cpp_tidy: ${{ steps.filter.outputs.cpp_tidy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          settings_schema=false
          powershell_quality=false
          cpp_tidy=false
          run_all=false

          case "$EVENT" in
            workflow_dispatch)
              run_all=true
              ;;
            pull_request)
              BASE="$PR_BASE"
              ;;
            push)
              BASE="$PUSH_BEFORE"
              ;;
            *)
              echo "::warning::Unknown event '$EVENT'; running all specialized jobs."
              run_all=true
              ;;
          esac

          # Avoid false-negative skips when the event comparison commit is unavailable.
          if [ "$run_all" = false ]; then
            if [ -z "${BASE:-}" ] ||
               [[ "$BASE" =~ ^0+$ ]] ||
               ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              echo "::warning::Changed-file base unavailable; running all specialized jobs."
              run_all=true
            fi
          fi

          if [ "$run_all" = true ]; then
            settings_schema=true
            powershell_quality=true
            cpp_tidy=true
          else
            echo "Classifying files changed since $BASE:"
            while IFS= read -r path; do
              printf '  %s\n' "$path"

              case "$path" in
                .github/workflows/windows.yml)
                  settings_schema=true
                  powershell_quality=true
                  cpp_tidy=true
                  ;;
                settings/*)
                  settings_schema=true
                  ;;
              esac

              case "$path" in
                *.ps1|*.psm1|*.psd1)
                  powershell_quality=true
                  ;;
              esac

              if [ -f "$path" ] &&
                 [[ "$path" =~ ^(core|ipc|learning|inference-host|bench)/.*\.(cpp|cc)$ ]]; then
                cpp_tidy=true
              fi
            done < <(git diff --name-only "$BASE" HEAD)
          fi

          {
            echo "settings_schema=$settings_schema"
            echo "powershell_quality=$powershell_quality"
            echo "cpp_tidy=$cpp_tidy"
          } | tee -a "$GITHUB_OUTPUT"
  settings-schema:
    name: Settings JSON Schema
    needs: changes
    if: needs.changes.outputs.settings_schema == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema==0.37.3

      - name: Validate settings schemas
        run: check-jsonschema --check-metaschema settings/mvp-settings.schema.json settings/model-catalog.schema.json

      - name: Validate default settings sample
        run: check-jsonschema --schemafile settings/mvp-settings.schema.json settings/default-settings.sample.json

  powershell-quality:
    name: PowerShell lint/test
    needs: changes
    if: needs.changes.outputs.powershell_quality == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $pester = Get-Module -ListAvailable Pester |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester -or $pester.Version -lt [version]'5.0.0') {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run PSScriptAnalyzer and Pester
        shell: pwsh
        run: ./scripts/test-powershell-quality.ps1

  quality:
    name: Pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install pinned quality tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pre-commit==4.6.2

          bin_dir="$RUNNER_TEMP/azookey-quality/bin"
          mkdir -p "$bin_dir"
          GOBIN="$bin_dir" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          cargo install taplo-cli --version 0.10.0 --locked \
            --root "$RUNNER_TEMP/azookey-quality/taplo"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/azookey-quality/taplo/bin" >> "$GITHUB_PATH"

      # These hooks have dedicated CI jobs (including the non-staged scan in
      # secret-scan.yml), so pre-commit only owns actionlint/taplo here.
      # yamlfmt remains
      # skipped until the existing whole-tree formatting baseline is resolved
      # by DEV-913. This avoids unrelated rewrites while still exercising the
      # repository's pre-commit entrypoint against every tracked file.
      - name: Run pre-commit CI-owned hooks
        env:
          SKIP: >-
            clang-format,gitleaks,powershell-quality,yamlfmt,
            settings-json-schema-metaschema,settings-json-schema-sample
        run: pre-commit run --all-files --show-diff-on-failure

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/dependency-review-action fails before analysis when the
      # repository Dependency Graph is disabled. Enabling that repository
      # setting is a Human Gate; keep the rollout visible without making every
      # PR red until the gate is completed.
      - name: Report dependency review prerequisite
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        shell: bash
        run: |
          echo "::warning::Dependency review is pending repository Dependency Graph enablement."
          {
            echo "## Dependency review pending"
            echo ""
            echo "Enable Dependency Graph and set the repository variable"
            echo "\`DEPENDENCY_REVIEW_ENABLED=true\` to activate the High/Critical gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review dependency changes
        if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  windows-build:
    name: Windows ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 45
    # このジョブだけが PR へ診断コメントを投稿するため pull-requests: write を持つ。
    # 他ジョブはワークフロー既定の contents: read のみ。
    permissions:
      contents: read
      pull-requests: write
    env:
      # The root CMakeLists auto-detects sccache on PATH and wires it as the
      # compiler launcher (flipping MSVC Debug info to /Z7 Embedded for cache
      # compatibility). SCCACHE_GHA_ENABLED stores objects in the Actions cache.
      SCCACHE_GHA_ENABLED: "true"
      # Resilience: if the cache backend errors at runtime, fall back to direct
      # compilation instead of failing the build (a cache must never break CI).
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: windows-debug
          - config: Release
            preset: windows-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # v0.0.10 wires the current (v2) Actions cache service. Older tags (e.g.
      # v0.0.6) only export the legacy ACTIONS_CACHE_URL (v1), which GitHub
      # retired on 2025-04-15 — that returns HTTP 400 and fails sccache startup.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache GoogleTest source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/${{ matrix.preset }}/_deps
          key: googletest-v1.17.0-${{ runner.os }}-${{ matrix.config }}

      - name: Configure
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --preset ${{ matrix.preset }} -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_WIL=ON 2>&1 | Tee-Object -FilePath configure-${{ matrix.config }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build --preset ${{ matrix.preset }} 2>&1 | Tee-Object -FilePath build-${{ matrix.config }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ matrix.config }}" -eq "Release") {
            cmake --build --preset ${{ matrix.preset }} --target azookey_settings 2>&1 | Tee-Object -Append -FilePath build-${{ matrix.config }}.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Cache pinned BinSkim package
        if: matrix.config == 'Release' && steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/binskim-cache
          key: binskim-4.4.9.11-win-x64-69678989cbc273b5

      # Advisory binary inspection (DEV-877). BinSkim has no rule for the PE
      # DependentLoadFlags field, so dumpbin verifies that DEV-876 invariant.
      - name: Analyze Release binary hardening (advisory)
        id: binary_hardening
        if: matrix.config == 'Release' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '4.4.9.11'
          $expectedHash = '69678989CBC273B5B50FCF98FB0FD978E1E35A3F844ACB24254B31F0CE90C447'
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'binskim-cache'
          $package = Join-Path $cacheRoot "Microsoft.CodeAnalysis.BinSkim.$version.nupkg"
          $toolRoot = Join-Path $env:RUNNER_TEMP "binskim-$version"
          $binskim = Join-Path $toolRoot 'tools/net9.0/win-x64/BinSkim.exe'
          $outputRoot = Join-Path $PWD 'binary-hardening'
          $sarifPath = Join-Path $outputRoot 'binskim.sarif'
          $reportPath = Join-Path $outputRoot 'summary.md'
          $report = [System.Collections.Generic.List[string]]::new()
          $failed = $false

          New-Item -ItemType Directory -Force -Path $cacheRoot, $outputRoot | Out-Null
          $report.Add('## Release binary hardening (advisory)')
          $report.Add('')
          $report.Add("BinSkim version: $version")
          $report.Add('')

          try {
            if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
              $uri = "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/$version/microsoft.codeanalysis.binskim.$version.nupkg"
              Invoke-WebRequest -Uri $uri -OutFile $package
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash
            if ($actualHash -ne $expectedHash) {
              throw "BinSkim package SHA-256 mismatch: expected $expectedHash, got $actualHash"
            }
            if (-not (Test-Path -LiteralPath $binskim -PathType Leaf)) {
              [System.IO.Compression.ZipFile]::ExtractToDirectory($package, $toolRoot, $true)
            }

            $targets = @(
              [pscustomobject]@{
                Name = 'azookey_tsf_tip.dll'
                Path = 'build/${{ matrix.preset }}/tsf-tip/azookey_tsf_tip.dll'
                RequireDev876Mitigations = $true
              },
              [pscustomobject]@{
                Name = 'azookey_inference_host.exe'
                Path = 'build/${{ matrix.preset }}/inference-host/azookey_inference_host.exe'
                RequireDev876Mitigations = $true
              },
              [pscustomobject]@{
                Name = 'azookey_settings.exe'
                Path = 'build/${{ matrix.preset }}/settings-app/Release/azookey_settings.exe'
                RequireDev876Mitigations = $false
              }
            )
            foreach ($target in $targets) {
              if (-not (Test-Path -LiteralPath $target.Path -PathType Leaf)) {
                throw "Release analysis target is missing: $($target.Path)"
              }
            }

            $targetPaths = @($targets | ForEach-Object { $_.Path })
            & $binskim analyze @targetPaths `
              --output $sarifPath `
              --config .github/binskim.config.xml `
              --ignorePdbLoadError true `
              --kind 'Fail;Pass;Review;Open;NotApplicable;Informational' `
              --level 'Error;Warning;Note' `
              --log 'ForceOverwrite;PrettyPrint' `
              --disable-telemetry true `
              --quiet true
            if ($LASTEXITCODE -ne 0) {
              throw "BinSkim failed with exit code $LASTEXITCODE"
            }

            $sarif = Get-Content -Raw -LiteralPath $sarifPath | ConvertFrom-Json -Depth 100
            $results = @($sarif.runs | ForEach-Object { $_.results })
            $signingResults = @($results | Where-Object { $_.ruleId -eq 'BA2022' })
            if ($signingResults.Count -ne 0) {
              throw 'BA2022 signing results were not suppressed by the committed policy'
            }

            $report.Add('| Binary | BinSkim BA2008 | dumpbin CFG | Dependent load flag |')
            $report.Add('| --- | --- | --- | --- |')
            foreach ($target in $targets) {
              $result = @($results | Where-Object {
                  $_.ruleId -eq 'BA2008' -and
                  $_.locations[0].physicalLocation.artifactLocation.uri.EndsWith(
                    $target.Name, [System.StringComparison]::OrdinalIgnoreCase)
                } | Select-Object -First 1)
              $cfgStatus = if ($result.Count -eq 0) {
                'missing'
              } elseif ($result[0].kind -eq 'pass') {
                'pass'
              } else {
                "finding ($($result[0].level))"
              }

              $dumpPath = Join-Path $outputRoot "dumpbin-$($target.Name).txt"
              $dumpOutput = @(& dumpbin /headers /loadconfig $target.Path 2>&1)
              $dumpExit = $LASTEXITCODE
              $dumpOutput | Set-Content -LiteralPath $dumpPath -Encoding utf8
              if ($dumpExit -ne 0) {
                throw "dumpbin failed for $($target.Name) with exit code $dumpExit"
              }
              $dumpText = $dumpOutput -join [Environment]::NewLine
              $hasCfg = $dumpText -match '(?m)^\s*Control Flow Guard\s*$'
              $hasDependentLoadFlag = $dumpText -match '(?mi)^\s*0B00 Dependent Load Flag\s*$'
              $dependentStatus = if ($target.RequireDev876Mitigations) {
                if ($hasDependentLoadFlag) { '0B00' } else { 'missing' }
              } else {
                'reported only'
              }
              $report.Add("| $($target.Name) | $cfgStatus | $hasCfg | $dependentStatus |")

              if ($target.RequireDev876Mitigations -and
                  ($cfgStatus -ne 'pass' -or -not $hasCfg -or -not $hasDependentLoadFlag)) {
                $failed = $true
              }
            }
            $report.Add('')
            $report.Add('`BA2022.SignSecurely` is disabled because signing occurs after CI packaging.')
            if ($failed) {
              throw 'One or more DEV-876 binary-hardening invariants were not observed'
            }
          } catch {
            $failed = $true
            $report.Add('')
            $report.Add("Analysis error: $($_.Exception.Message)")
            Write-Error $_ -ErrorAction Continue
          } finally {
            $report | Set-Content -LiteralPath $reportPath -Encoding utf8
            $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

          if ($failed) { exit 1 }

      # 成果物から RT_MANIFEST を取り出して <msix> identity を確認する（DEV-101 / M28）。
      # CMake 配線の静的チェックだけでは「埋め込みが実際に効いているか」は分からず、
      # 外れても症状は実機（Package.Current が null）でしか出ないため、ビルド直後に落とす。
      - name: Verify MSIX identity embedding
        id: verify_identity
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/verify-msix-identity-embedding.ps1 -ExePath build/${{ matrix.preset }}/inference-host/azookey_inference_host.exe

      - name: Report sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Run tests via CTest
        id: run_tests
        continue-on-error: true
        shell: pwsh
        run: |
          ctest --preset ${{ matrix.preset }} --no-tests=error 2>&1 | Tee-Object -FilePath test-report-${{ matrix.config }}.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 失敗時のみ投稿する（dev-infra spec §4 の基盤定義は「失敗時 PR コメント +
      # test_report artifact」。成功時はログ artifact で十分で、毎 push の成功
      # コメントは PR を埋めるノイズになるため）。
      - name: Post diagnostic comment to PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          !github.event.pull_request.head.repo.fork &&
          (steps.configure.outcome != 'success' ||
           steps.build.outcome != 'success' ||
           steps.run_tests.outcome != 'success')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const readSafe = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '(not produced)';
            const config = '${{ matrix.config }}';
            const configureLog = readSafe(`configure-${config}.log`);
            const buildLog = readSafe(`build-${config}.log`);
            const testReport = readSafe(`test-report-${config}.md`);
            const truncate = (s, n) => s.length > n ? s.slice(-n) + '\n...[truncated]' : s;
            const body = [
              `## Windows ${config} CI diagnostic (run ${context.runId})`,
              '',
              `### Configure (tail)`,
              '```',
              truncate(configureLog, 4000),
              '```',
              `### Build (tail)`,
              '```',
              truncate(buildLog, 6000),
              '```',
              `### Tests`,
              '```',
              truncate(testReport, 6000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.config }}-logs
          path: |
            configure-${{ matrix.config }}.log
            build-${{ matrix.config }}.log
            test-report-${{ matrix.config }}.md
          if-no-files-found: ignore

      - name: Upload Release symbols
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-pdb
          path: build/${{ matrix.preset }}/**/*.pdb
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Release binary hardening report
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-binary-hardening
          path: binary-hardening/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if configure, build, or tests failed
        if: always()
        shell: pwsh
        run: |
          $results = [ordered]@{
            Configure = '${{ steps.configure.outcome }}'
            Build = '${{ steps.build.outcome }}'
            MsixIdentity = '${{ steps.verify_identity.outcome }}'
            Tests = '${{ steps.run_tests.outcome }}'
          }
          $failed = @()
          foreach ($entry in $results.GetEnumerator()) {
            Write-Host "$($entry.Key): $($entry.Value)"
            # MsixIdentity は Build 失敗時に skipped になる。その場合は Build 自体が
            # 失敗として計上されるため、skipped を重ねて報告しない。
            if ($entry.Value -ne 'success' -and $entry.Value -ne 'skipped') {
              $failed += $entry.Key
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed CI phases: $($failed -join ', ')"
            exit 1
          }

  windows-llama-build:
    name: Windows llama.cpp real-model smoke
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache fetched dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/windows-llama/_deps
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Cache pinned Zenzai model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/model-cache
          key: zenz-v3.2-small-gguf-c67e03e0-q5-k-m-29c223d4

      - name: Download and verify pinned Zenzai model
        shell: pwsh
        run: |
          $modelDir = Join-Path $PWD "build/model-cache"
          $modelPath = Join-Path $modelDir "ggml-model-Q5_K_M.gguf"
          $expectedSha = "29c223d4c23327b80fd13ebb5ab2555057a46317997d5da391584ffbef0db673"
          $modelUrl = "https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/c67e03e07d215c869f591b274c1631170d3e11fe/ggml-model-Q5_K_M.gguf"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          if (Test-Path -LiteralPath $modelPath) {
            $cachedSha = (Get-FileHash -LiteralPath $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($cachedSha -ne $expectedSha) {
              Remove-Item -LiteralPath $modelPath -Force
            }
          }
          if (-not (Test-Path -LiteralPath $modelPath)) {
            curl.exe --fail --location --retry 3 --output $modelPath $modelUrl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $actualSha = (Get-FileHash -LiteralPath $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "Zenzai model SHA256 mismatch: expected $expectedSha, got $actualSha"
          }
          "AZOOKEY_REAL_MODEL=$modelPath" >> $env:GITHUB_ENV

      - name: Configure llama.cpp build
        shell: pwsh
        run: |
          $cmakeModelPath = $env:AZOOKEY_REAL_MODEL.Replace('\', '/')
          cmake -S . -B build/windows-llama -G Ninja -DCMAKE_BUILD_TYPE=Release -DAZOOKEY_BUILD_TESTS=ON -DAZOOKEY_BUILD_BENCH=ON -DAZOOKEY_FETCH_GOOGLETEST=ON -DAZOOKEY_FETCH_WIL=ON -DAZOOKEY_FETCH_LLAMA_CPP=ON "-DAZOOKEY_ZENZAI_TEST_MODEL=$cmakeModelPath" 2>&1 | Tee-Object -FilePath configure-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build host tests and Zenzai bench with llama.cpp
        shell: pwsh
        run: |
          cmake --build build/windows-llama --target host_engine_tests azookey_zenzai_bench --parallel 1 2>&1 | Tee-Object -FilePath build-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pinned real-model smoke via CTest
        shell: pwsh
        run: |
          ctest --test-dir build/windows-llama -L zenzai-real-model --verbose --no-tests=error 2>&1 | Tee-Object -FilePath test-llama.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testLog = Get-Content -Raw -LiteralPath test-llama.log
          if ($testLog -notmatch 'model_loaded=1') {
            throw "Real-model smoke did not report model_loaded=1"
          }
          if ($testLog -notmatch 'zenzai_candidates=[1-9][0-9]*') {
            throw "Real-model smoke did not report any Zenzai candidates"
          }
          if ($testLog -notmatch 'top_surface=日本語 top_debug_info=') {
            throw "Real-model smoke did not convert にほんご exactly to 日本語"
          }
          if ($testLog -notmatch 'top_surface=私は学生です top_debug_info=') {
            throw "Real-model smoke did not convert わたしはがくせいです exactly to 私は学生です"
          }
          if ($testLog -notmatch 'prompt_token_ids=172,120,202,444,677,259,796,172,120,203') {
            throw "Real-model smoke token IDs did not match the pinned reference for にほんご"
          }
          if ($testLog -notmatch 'prompt_token_ids=172,120,202,628,327,330,623,643,299,492,280,406,271,172,120,203') {
            throw "Real-model smoke token IDs did not match the pinned reference for わたしはがくせいです"
          }
          if ($testLog -match 'utf8-prefix-trimmed') {
            throw "Real-model smoke observed utf8-prefix-trimmed after EOS handling"
          }

      - name: Report sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Upload llama.cpp build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-llama-build-logs
          path: |
            configure-llama.log
            build-llama.log
            test-llama.log
          if-no-files-found: ignore

  linux-build:
    name: Linux Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache GoogleTest source
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/linux-debug/_deps
          key: googletest-v1.17.0-${{ runner.os }}-Debug
          restore-keys: |
            googletest-v1.17.0-${{ runner.os }}-

      - name: Configure
        run: cmake --preset linux-debug -DAZOOKEY_FETCH_GOOGLETEST=ON

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run tests via CTest
        run: ctest --preset linux-debug --no-tests=error

  linux-no-tests:
    name: Linux build without tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure without tests or benchmarks
        run: >-
          cmake -S . -B build/linux-no-tests -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAZOOKEY_BUILD_TESTS=OFF
          -DAZOOKEY_BUILD_BENCH=OFF
          -DAZOOKEY_FETCH_GOOGLETEST=OFF
          -DAZOOKEY_FETCH_WIL=OFF

      - name: Build without tests or benchmarks
        run: cmake --build build/linux-no-tests

  windows-no-tests:
    name: Windows build without tests
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure without tests or benchmarks
        shell: pwsh
        run: cmake --preset windows-no-tests -DAZOOKEY_FETCH_WIL=ON

      - name: Build Windows-only targets without tests or benchmarks
        shell: pwsh
        run: |
          cmake --build --preset windows-no-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-no-tests --target azookey_settings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # cpp-quality was a single sequential job (format then tidy). It is split into
  # two independent jobs so the required format gate and the advisory tidy run
  # concurrently — the required gate fails fast without waiting on the slower
  # tidy configure step (dev-infra spec §4.3/§11.5).
  cpp-format:
    name: C++ format (changed-lines gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          # Need the PR base commit so the changed-lines gate can diff against it.
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      # Required gate. Enforces .clang-format on newly added/changed lines only
      # (dev-infra spec M37 acceptance: clang-format is zero-diff for new code).
      # A whole-tree reformat + full-tree gate is tracked separately so this PR
      # does not fail on pre-existing formatting debt (spec §2.3/§4.3).
      - name: clang-format changed-lines gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          # Fall back to the previous commit for new branches / force pushes where
          # the reported base is absent or the zero SHA.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          echo "Comparing changed lines against $BASE"
          DIFF="$(git-clang-format-18 --binary clang-format-18 --diff \
            --extensions cpp,cc,h,hpp "$BASE" -- \
            core ipc learning inference-host tsf-tip bench)"
          if [ "$DIFF" = "no modified files to format" ] || \
             [ "$DIFF" = "clang-format did not modify any files" ]; then
            echo "clang-format: changed lines are clean."
            exit 0
          fi
          echo "clang-format found violations on changed lines:"
          printf '%s\n' "$DIFF"
          echo "::error::Run 'just format' (or clang-format) on your changes."
          exit 1

  cpp-tidy:
    name: C++ tidy (advisory)
    needs: changes
    if: needs.changes.outputs.cpp_tidy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
          # Need the PR base commit so the changed-files diff can target it.
          fetch-depth: 0

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang-tidy-18

      # Advisory only (dev-infra spec §11.5: clang-tidy is an optional extension,
      # not a required gate). Surfaces static-analysis findings on changed files
      # without failing the build; never blocks a PR.
      - name: clang-tidy changed files (advisory)
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          # Offline configure only to emit compile_commands.json (tests excluded;
          # keeps the offline-build principle, spec §1). tsf-tip is Windows-only
          # and absent from the Linux DB, so it is naturally skipped here.
          cmake --preset linux-debug -DAZOOKEY_FETCH_GOOGLETEST=OFF >/dev/null
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACM "$BASE" HEAD \
            | grep -E '^(core|ipc|learning|inference-host|bench)/.*\.(cpp|cc)$' || true)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "clang-tidy: no changed C++ source files in the portable subset."
            exit 0
          fi
          echo "Running clang-tidy on:"
          printf '%s\n' "${CHANGED[@]}"
          clang-tidy-18 -p build/linux-debug "${CHANGED[@]}" || true
