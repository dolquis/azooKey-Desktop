# Pre-commit hooks wired to locally-installed tools (LLVM + scoop), so no hook
# repos are fetched over the network — consistent with the project's offline
# build principle. These mirror the lightweight CI gates (format, secret scan,
# workflow lint) so problems surface before pushing.
#
#   pre-commit install         # enable the git hook (one time)
#   pre-commit run --all-files # run across the whole tree (or: just lint)
#
# Tool sources: clang-format/LLVM, gitleaks/yamlfmt/taplo/actionlint via scoop,
# check-jsonschema via pipx (`pipx install check-jsonschema==0.37.3`),
# PSScriptAnalyzer/Pester via PowerShell Gallery local modules.
minimum_pre_commit_version: "3.0.0"
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (C/C++)
        entry: clang-format
        args: [-i]
        language: system
        types_or: [c, c++]
        exclude: '^legacy/'

      - id: gitleaks
        name: gitleaks (staged secret scan)
        entry: gitleaks git --staged --no-banner --redact
        language: system
        pass_filenames: false

      - id: actionlint
        name: actionlint (GitHub workflows)
        entry: actionlint
        language: system
        files: '^\.github/workflows/.*\.(yml|yaml)$'

      - id: powershell-quality
        name: PowerShell lint/test (PSScriptAnalyzer + Pester)
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-powershell-quality.ps1
        language: system
        pass_filenames: false
        files: '^((scripts|compat-test)/.*\.ps1|PSScriptAnalyzerSettings\.psd1)$'

      - id: settings-json-schema-metaschema
        name: settings JSON Schema metaschemas
        entry: check-jsonschema
        args:
          - --check-metaschema
          - settings/mvp-settings.schema.json
          - settings/model-catalog.schema.json
        language: system
        pass_filenames: false
        files: '^settings/(mvp-settings|model-catalog)\.schema\.json$'

      - id: settings-json-schema-sample
        name: settings sample JSON Schema
        entry: check-jsonschema
        args:
          - --schemafile
          - settings/mvp-settings.schema.json
          - settings/default-settings.sample.json
        language: system
        pass_filenames: false
        files: '^settings/(mvp-settings\.schema\.json|default-settings\.sample\.json)$'

      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: system
        types: [yaml]
        exclude: '^legacy/'

      - id: taplo
        name: taplo fmt (TOML)
        entry: taplo fmt
        language: system
        types: [toml]
