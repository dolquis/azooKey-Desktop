# scripts/check_doc_refs.py の例外リスト。
#
# 文書が名指しする参照のうち、いま実在しないが正しいものだけを登録する。
# 検査は登録の陳腐化も落とす。参照先が実在したら、またはどの文書も参照しなく
# なったら、そのエントリを削除する。
#
# 各エントリ:
#   ref       検査が報告する参照文字列（repo パス、`path::Symbol`、`docs/x.md §N`）
#   kind      planned        M で作る予定のもの。milestone と spec（正典の節）が要る
#             origin         origin（dolquis/agent-ops）にだけ在るもの。この repo では直さない
#             external       他リポジトリのパス（参考資料の中の比較対象）
#             historical     ある時点の記録として書かれたパス
#             runtime        build directory やユーザーデータディレクトリを基準にした相対パス
#             unowned        予定だが所有する M が無いもの。判断を追う Linear の課題を issue に書く
#   reason    登録の理由
#   files     （任意）この例外を使ってよい文書。省略するとどの文書でも使える

